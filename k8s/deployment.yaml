apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxorx-deployment
  labels:
    app: fluxorx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluxorx
  template:
    metadata:
      labels:
        app: fluxorx
    spec:
      containers:
        - name: fluxorx
          image: beyondiq-fluxorx:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxorx-secrets
                  key: resend-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"